name: Test

run-name: 'Test ${{ github.ref_name }}@${{ github.sha }}'

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_ENV: test
  MOCK_API: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Run tests
        run: npm test

  mcp-validator:
    name: MCP protocol (${{ matrix.mcp_protocol_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mcp_protocol_version:
          - '2024-11-05'
          - '2025-03-26'
          - '2025-06-18'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build server
        run: npm run build

      - uses: actions/checkout@v4
        with:
          repository: Janix-ai/mcp-validator
          ref: v0.3.1
          path: mcp-validator

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run MCP Validator (stdio)
        working-directory: mcp-validator
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          python -m mcp_testing.scripts.compliance_report \
            --server-command "node ${GITHUB_WORKSPACE}/build/main.js" \
            --protocol-version "${{ matrix.mcp_protocol_version }}" \
            --dynamic-only

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-validator-reports-${{ matrix.mcp_protocol_version }}
          path: mcp-validator/reports/

  # Janix mcp-validator HTTP job removed: http_compliance_test (v0.3.1) sends a non-spec
  # initialize body; MCP SDK rejects it with 400. Restore a job here when upstream is fixed.

  test-build:
    name: Test Docker Image Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker
        uses: ./.github/actions/setup-docker

      - name: Test build multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev-${{ github.sha }}
